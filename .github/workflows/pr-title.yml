name: pr-title

# PRs are squash-merged with their title as the commit message, which
# release-please reads: the title must be a conventional commit, such as
# "fix(jit): …" or "perf(lua): …". It reads only the PR's title, never its
# code, so pull_request_target is safe here.

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
