name: pr-title

# PRs are squash-merged with their title as the commit message, which
# release-please reads: the title must be a conventional commit, such as
# "fix(jit): …" or "perf(lua): …". It reads only the PR's title, never its
# code, so pull_request_target is safe here.

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
